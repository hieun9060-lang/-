  - id: sidae
    name: 시대인재 기숙학원
    template_name: 시대인재 기숙학원
    aliases: [시대인재기숙, 시대인재 기숙, 시대인재 재수종합 기숙, 시대인재]
    domains: [sdij]

  - id: bisang
    name: 비상에듀 기숙학원
    template_name: 비상에듀 기숙학원
    aliases: [비상에듀기숙, 비상에듀 기숙학원, 비상에듀, 용인비상]
    domains: [visang, bisangedu]

  - id: itall
    name: 잇올 기숙(독학)
