    aliases: [이천청솔, 청솔기숙, 청솔학원, 종로청솔, 이천종로]
    domains: [chungsol, jongro]

  - id: jongro_m
    name: 강남종로엠 기숙학원
    template_name: 강남종로엠 기숙학원
    aliases: [강남종로엠, 종로엠, 종로학원 기숙, 종로기숙]
