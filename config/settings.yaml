# 일일 측정 설정
engines: []            # 비워두면 API 키가 있는 엔진(claude/chatgpt/gemini/perplexity)을 모두 사용
models: {}             # 예: {claude: claude-opus-5-5, chatgpt: gpt-5, gemini: gemini-2.5-flash, perplexity: sonar}
samples_per_question: 1  # AI 답변은 매번 달라지므로 2~3으로 올리면 더 안정적 (비용 비례 증가)
concurrency: 6
include_templates: true  # 학원별 동일 질문 비교 포함 여부
trend_days: 14
ai_insight: true       # ANTHROPIC_API_KEY 가 있으면 Claude 가 오늘 결과를 해설
