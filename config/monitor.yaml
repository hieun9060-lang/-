workspace:
  name: WORKSPACE-A
  title: 기숙학원 모니터링

# 화면 맨 위에 보이는 '확정 리서치' 문구 (AI 요약·분석의 기준이 됩니다)
goal:
  title: 자사와 경쟁사 흐름 비교
  desc: 이 기준에 맞춰 경쟁사 변화와 업계 흐름을 구분합니다.

