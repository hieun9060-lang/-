name: Daily AI mention check

# GitHub 예약 실행은 UTC 기준이며 저장소 기본 브랜치에서만 동작합니다.
#  - 22:30 UTC = 07:30 KST : AI 챗봇 측정 + 리포트 생성 (실행에 수십 분 걸릴 수 있어 여유를 둠)
#  - 00:00 UTC = 09:00 KST : 리포트 요약 알림 (GitHub 이슈 / Slack / 이메일)
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = 측정+리포트, notify = 알림만, both = 둘 다"
        default: both
        type: choice
        options: [both, collect, notify]
      engines:
        description: "엔진 지정 (예: claude,chatgpt). 비우면 키가 있는 엔진 모두"
        required: false

concurrency:
  group: daily-ai-mention
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  TZ: Asia/Seoul
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  REPORT_SITE_URL: ${{ vars.REPORT_SITE_URL }}

jobs:
  collect:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'notify')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Measure AI answers and build report
        run: |
          if [ -n "${{ inputs.engines }}" ]; then
            python -m aeo_monitor run --engines "${{ inputs.engines }}"
          else
            python -m aeo_monitor run
          fi
      - name: Save history and report to repository
        run: |
          git config user.name "aeo-monitor-bot"
          git config user.email "aeo-monitor-bot@users.noreply.github.com"
          git add data/aeo.db docs/
          git commit -m "AI mention report $(date +%F)" || echo "no changes"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((2**i))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mention-report
          path: docs/reports/
          retention-days: 30

  pages:
    # 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하고, 변수 ENABLE_PAGES=true 를 추가하면 활성화
    needs: collect
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

  notify:
    needs: [collect]
    if: >-
      always() && (
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'collect'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send 09:00 KST briefing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m aeo_monitor notify
